# The SPA's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. The site does that today, so its "page not found" screen is
# delivered as a success: search engines index it, uptime checks call it healthy, link checkers
# pass, and a deploy that drops a route looks exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and the route table in src/app.tsx must agree. That is one line per
# top-level route, paid once per route, in exchange for an honest status code on every wrong URL.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it —
# a conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces, and test/sitemap.test.ts reads that
# export and fails if this alternation has drifted from it. They are the words that name an
# environment rather than a surface: `surfaces.ts` reserves them so that no surface may take one
# as a subdomain, and `deploy/scripts/check-apex-prefix.py` enforces that.
#
# A testnet Emberkin carries a test roster, a seeded world and deliberately broken encounters.
# Indexed beside the real game, its pages are a dex and a wardrobe that look exactly like the ones
# a player would buy a cosmetic in — which makes this a support problem before it is an SEO one. So
# a non-mainnet environment answers `Disallow: /` and serves no sitemap.
#
# `(?:[^.]+-)?` catches BOTH shapes. The environment is a suffix on the first label now
# (`emberkin-testnet.<apex>`) and was an apex prefix before (`testnet.<apex>`, which put this
# surface at the two-label `emberkin.testnet.<apex>` — unreachable, because Cloudflare's Universal
# SSL is a one-label wildcard and every two-label name fails the handshake at the edge).
# `surfaces.ts` keeps the old shape deliberately, so both have to match or half the estate stays
# indexable on testnet.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # No frame-ancestors beyond self: the bar carries a session, and a product framed by another
    # origin is a clickjacking surface for whatever that session can do.
    #
    # ────────────────────────────────────────────────────────────────────────────────────────────
    # THESE ARE REPEATED IN EVERY `location` BELOW THAT SETS ANY HEADER OF ITS OWN, AND THAT IS
    # NOT REDUNDANCY.
    #
    # nginx's `add_header` inheritance is ALL OR NOTHING PER LEVEL: a location containing even one
    # `add_header` discards every `add_header` from the enclosing block. So a location that adds a
    # Cache-Control silently drops all three of these — the directive it added is visible in the
    # diff and the three it removed are not.
    #
    # This is not theoretical and it is not only this file. The web template's own nginx.conf sets
    # Cache-Control inside `location /assets/` and `location = /index.html`, and therefore serves
    # every hashed asset in every application cut from it with no `X-Content-Type-Options` at all.
    # MEASURED against a running image rather than reasoned about: before this fix,
    # `curl -I http://…/` and `curl -I http://…/art/…png` both returned none of the three.
    # ────────────────────────────────────────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- the game's static payload ---------------------------------------
    # 47 MB of generated art under /art/ and 18 MB of procedural glTF and PBR maps under /game/.
    # Immutable-cached like the bundle's own assets, and for a stronger reason: these files are
    # content-addressed by what they ARE — a species portrait for `cindercub` is that picture —
    # so a change to one is a change to the asset set, which ships as a new image.
    #
    # A missing one must 404 on its own terms. A .glb request answered with the app shell parses
    # as garbage inside GLTFLoader and reports a failure that names neither file.
    # Two prefix locations rather than one regex alternation, deliberately: the ONE regex
    # `location ~ ^/(…)` block in this file is the enumerated route list, and test/routes.test.ts
    # finds it by that shape. A second alternation would be matched first and the route check
    # would then be reading the wrong list — and passing.
    location /art/ {
        try_files $uri =404;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /game/ {
        try_files $uri =404;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    #
    # THE HEADER HAS TO BE REPEATED ON EVERY LOCATION THAT SERVES IT, and this is the one thing
    # here the web template gets wrong. `location = /index.html` only matches a request for that
    # literal path; `location = /` and the enumerated route block below serve the same file through
    # `try_files` WITHOUT re-entering this block, so under the template's config the most-requested
    # address in the application — `/` — is served with no cache directive at all. Measured against
    # a running image, not assumed: `curl -I http://…/` returned no Cache-Control.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts, which is also what the router and the
    # navigation are built from. test/routes.test.ts checks all three against each other, because
    # a route added to the router and not here works perfectly under `pnpm dev` and 404s on the
    # first hard refresh in production — a failure nothing about the diff looks like.
    location = / {
        add_header Cache-Control "no-store" always;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    # `/?$`, NOT `(/|$)`. The second is a PREFIX: /party/kin-1, /dex/aetherion and every other
    # address beneath an owned route were served the shell with a 200 while React rendered the
    # not-found page inside them. No route in this client takes a parameter. Same defect as
    # micro-web-template's, and `site` records finding it in /products/pay; found here by a browser
    # scenario probing the address rather than by reading the file.
    location ~ ^/(party|dex|satchel|wardrobe|settings|credits)/?$ {
        add_header Cache-Control "no-store" always;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    # ---- the sitemap and robots.txt, emitted with $host -------------------
    # THEY ARE HERE RATHER THAN IN public/ FOR THE ONE REASON THAT DECIDES IT: a sitemap must carry
    # ABSOLUTE URLs — the spec requires it and a crawler discards a relative `<loc>` — and nothing
    # built in this repository is allowed to name a hostname, because one image is served from
    # localhost, from a preview deployment and from the apex (test/no-build-time-config.test.ts).
    # nginx is the component that knows: it has `$host` on every request, so the addresses are
    # composed per request and the artefact stays environment-free.
    #
    # `public/` would also be the wrong place mechanically: an exact-match location wins over the
    # `location /` that serves the static tree, so a file there would be deployed, unreachable, and
    # edited by the next reader to no effect. test/sitemap.test.ts asserts neither file exists.
    #
    # ── WHY THIS IS NOT `sitemapXml()` FROM @cloudsforge/ui ──────────────────────────────────
    #
    # THIS SURFACE IS NOT THE APEX. The shared generator composes every sibling as
    # `<subdomain>.$host`, which is exactly right on the marketing site, where `$host` IS the apex.
    # Here `$host` is already `emberkin.<apex>`, so the same generator would emit
    # `worlds.emberkin.<apex>` — a two-label hostname that resolves to nothing and fails the edge's
    # one-label wildcard certificate. A sitemap of addresses that cannot be connected to is worse
    # than no sitemap: a crawler handed dead URLs by a site's own index discounts the ones that
    # work.
    #
    # So this surface lists ITS OWN public routes and nothing else, and the estate sitemap stays
    # the apex's job. The list is `PUBLIC_PATHS` in src/lib/routes.ts, which is derived from the
    # same ROUTES table the router, the navigation and the enumerated location block above all come
    # from; test/sitemap.test.ts checks this block against it in both directions.
    #
    # /party, /satchel AND /wardrobe ARE DELIBERATELY ABSENT. Each is behind `ProtectedRoute`, so a
    # crawler following the link is handed a redirect to hub's sign-in rather than a page, and each
    # shows one player their own Kin, their own items and their own cosmetics — nothing a stranger
    # can read. `/` is protected too and IS listed, because it is the front door the ESTATE's own
    # sitemap already publishes for this surface; the reasoning is written out beside PUBLIC_PATHS.
    location = /sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of
        # the two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host</loc></url>
  <url><loc>$scheme://$host/dex</loc></url>
  <url><loc>$scheme://$host/settings</loc></url>
  <url><loc>$scheme://$host/credits</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Every environment but mainnet refuses every crawler, whole.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        return 200 'User-agent: *
Allow: /

Sitemap: $scheme://$host/sitemap.xml
';
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon, robots.txt) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
